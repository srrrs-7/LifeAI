      <text x="16" y="62" font-size="12" fill="#5D4037">意思決定の質は仮説の量と幅が決める</text>
      <rect x="16" y="72" width="68" height="12" rx="6" fill="#FF6D00"/>
      <text x="50" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">MINDSET</text>
