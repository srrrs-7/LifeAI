  <circle cx="1100" cy="940" r="60" fill="#7C4DFF" opacity="0.12"/>
  <circle cx="1060" cy="980" r="40" fill="#536DFE" opacity="0.08"/>
  <text x="56" y="938" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="968" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">思考を止めない — 仮説は複数、議論は課題から</text>
  <text x="56" y="996" font-size="13" font-weight="400" fill="rgba(255,255,255,0.7)">抽象化の先にある具体化で差をつけ、縦と横どちらにも妥協を残さない</text>

