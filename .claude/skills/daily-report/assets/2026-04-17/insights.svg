      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">仮説思考の回数を増やす・複数案並行</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">縦×横の思考に妥協がないか常に点検</text>
    </g>
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">Entra MFA の落とし所と代替案の整理</text>
    </g>
  </g>

  <!-- KEY THEME BANNER — y=904, h=120 -->
