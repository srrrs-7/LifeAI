    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="700" fill="#536DFE">4/13</text>
    <text x="0" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#5D4037">ロックイン設計</text>

    <circle cx="293" cy="21" r="14" fill="url(#accentGrad)"/>
    <text x="293" y="-4" text-anchor="middle" font-size="10" font-weight="700" fill="#536DFE">4/14</text>
    <text x="293" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#5D4037">why-what-how 往復</text>

    <circle cx="586" cy="21" r="14" fill="url(#accentGrad)"/>
    <text x="586" y="-4" text-anchor="middle" font-size="10" font-weight="700" fill="#536DFE">4/15</text>
    <text x="586" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#5D4037">縦×横視点・ベンチマーク</text>

    <circle cx="880" cy="21" r="16" fill="url(#warmGrad)"/>
    <text x="880" y="-4" text-anchor="middle" font-size="10" font-weight="800" fill="#FF1744">4/17 TODAY</text>
    <text x="880" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#BF360C">仮説思考・課題ベース議論</text>

    <circle cx="1100" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="1100" y="-4" text-anchor="middle" font-size="10" font-weight="700" fill="#00C853">NEXT</text>
    <text x="1100" y="48" text-anchor="middle" font-size="10" font-weight="600" fill="#5D4037">顧客理解の具体化</text>
  </g>

  <g transform="translate(56, 1216)">
    <text x="0" y="14" font-size="12" font-weight="600" fill="#78909C">LEVERS</text>
    <rect x="60" y="0" width="120" height="22" rx="11" fill="url(#accentGrad)"/>
    <text x="120" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">複数仮説の並列化</text>
    <rect x="188" y="0" width="108" height="22" rx="11" fill="url(#sunGrad)"/>
    <text x="242" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">課題ベース進行</text>
    <rect x="304" y="0" width="124" height="22" rx="11" fill="url(#warmGrad)"/>
    <text x="366" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Federated 基本方針</text>
    <rect x="436" y="0" width="108" height="22" rx="11" fill="url(#greenGrad)"/>
    <text x="490" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">縦×横の点検</text>
