  <text x="56" y="1084" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">GROWTH PATH</text>
  <text x="56" y="1106" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">思考の進化ライン（4/13 → 4/17）</text>

