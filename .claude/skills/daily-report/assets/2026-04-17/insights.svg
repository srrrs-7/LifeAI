      <rect x="0" y="0" width="6" height="88" rx="3" fill="url(#warmGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="800" fill="#BF360C">アジェンダ vs 課題ベースの議論</text>
      <text x="16" y="44" font-size="12" font-weight="500" fill="#4E342E">進行役は全体像を揃えてから話し始める</text>
      <text x="16" y="62" font-size="12" font-weight="500" fill="#4E342E">現在地を共有できるかで成果が大きく変わる</text>
      <rect x="16" y="72" width="88" height="12" rx="6" fill="url(#warmGrad)"/>
      <text x="60" y="82" text-anchor="middle" font-size="8" font-weight="800" fill="#FFFFFF">KEY INSIGHT</text>
