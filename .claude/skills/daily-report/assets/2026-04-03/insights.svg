<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1276" viewBox="0 0 1200 1276" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="100%" stop-color="#1a237e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFAB00" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FF1744" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="keyInsightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <filter id="elevation1" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.07)" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.05)" />
    </filter>
    <filter id="elevation2" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.10)" />
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="rgba(0,0,0,0.08)" />
    </filter>
    <clipPath id="heroClip">
      <rect width="1200" height="100" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1276" fill="#f5f5f7" />

  <!-- ==================== HERO HEADER (y=0, h=100) ==================== -->
  <g clip-path="url(#heroClip)">
    <rect width="1200" height="100" fill="url(#heroGrad)" />
    <circle cx="1100" cy="20" r="120" fill="#536DFE" opacity="0.07" />
    <circle cx="1140" cy="80" r="70" fill="#7C4DFF" opacity="0.05" />
    <circle cx="50" cy="80" r="40" fill="#00E5FF" opacity="0.04" />
  </g>

  <!-- Date chip -->
  <rect x="40" y="12" width="200" height="24" rx="12" fill="rgba(255,255,255,0.1)" />
  <text x="56" y="29" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">2026-04-03 Friday</text>

  <!-- Title + subtitle -->
  <text x="40" y="52" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">本番PR / プランニング / 発想転換</text>
  <text x="40" y="74" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">経験で勝負する限界を見極め、「作り手側」で差別化する方向性が見えた一日</text>

  <!-- Stats badges -->
  <g transform="translate(860, 68)">
    <rect width="84" height="22" rx="11" fill="url(#accentGrad)" opacity="0.9" />
    <text x="12" y="16" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
    <text x="28" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.85)">TASKS</text>
    <rect x="92" width="108" height="22" rx="11" fill="url(#sunGrad)" opacity="0.9" />
    <text x="104" y="16" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
    <text x="120" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.9)">INSIGHTS</text>
  </g>

  <!-- ==================== ROW 1: ACTIVITIES + INSIGHTS (y=124, h=484) ==================== -->

  <!-- ACTIVITIES card (left) -->
  <rect x="24" y="124" width="564" height="484" rx="16" fill="#FFFFFF" filter="url(#elevation1)" />
  <rect x="24" y="124" width="564" height="4" rx="2" fill="url(#accentGrad)" />
  <text x="48" y="160" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">ACTIVITIES</text>
  <text x="48" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">実施事項</text>
  <text x="564" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#536DFE">x4</text>

  <g transform="translate(48, 200)">
    <!-- Activity 1 -->
    <rect x="0" y="0" width="520" height="40" rx="10" fill="#EDE7F6" />
    <rect x="12" y="12" width="16" height="16" rx="4" fill="url(#accentGrad)" />
    <text x="38" y="26" font-size="14" font-weight="600" fill="#0a0a1a">本番リリースPR作成</text>

    <!-- Activity 2 -->
    <rect x="0" y="48" width="520" height="40" rx="10" fill="#EDE7F6" />
    <rect x="12" y="60" width="16" height="16" rx="4" fill="url(#accentGrad)" />
    <text x="38" y="74" font-size="14" font-weight="600" fill="#0a0a1a">プランニング・リファインメント参加</text>

    <!-- Activity 3 -->
    <rect x="0" y="96" width="520" height="40" rx="10" fill="#EDE7F6" />
    <rect x="12" y="108" width="16" height="16" rx="4" fill="url(#accentGrad)" />
    <text x="38" y="122" font-size="14" font-weight="600" fill="#0a0a1a">顧客先読みの実践と振り返り</text>

    <!-- Activity 4 -->
    <rect x="0" y="144" width="520" height="40" rx="10" fill="#EDE7F6" />
    <rect x="12" y="156" width="16" height="16" rx="4" fill="url(#accentGrad)" />
    <text x="38" y="170" font-size="14" font-weight="600" fill="#0a0a1a">タスク優先順位の3軸を整理</text>
  </g>

  <!-- INSIGHTS card (right) -->
  <rect x="612" y="124" width="564" height="484" rx="16" fill="#FFFFFF" filter="url(#elevation1)" />
  <rect x="612" y="124" width="564" height="4" rx="2" fill="url(#sunGrad)" />
  <text x="636" y="160" font-size="11" font-weight="800" fill="#E65100" letter-spacing="1.5">INSIGHTS</text>
  <text x="636" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">気づき・学び</text>
  <text x="1152" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#E65100">x4</text>

  <g transform="translate(636, 200)">
    <!-- Insight 1 (KEY INSIGHT) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="url(#keyInsightBg)" filter="url(#elevation1)" />
      <rect x="0" y="0" width="6" height="88" rx="3" fill="url(#warmGrad)" />
      <text x="16" y="24" font-size="14" font-weight="800" fill="#BF360C">「作り手側」で勝負する発想転換</text>
      <text x="16" y="44" font-size="12" font-weight="500" fill="#4E342E">経験の差は線形にしか埋まらない。</text>
      <text x="16" y="62" font-size="12" font-weight="500" fill="#4E342E">独自の感性で「提案できる価値」を創る</text>
      <rect x="16" y="72" width="80" height="12" rx="6" fill="url(#warmGrad)" />
      <text x="56" y="82" text-anchor="middle" font-size="8" font-weight="800" fill="#FFFFFF">KEY INSIGHT</text>
    </g>

    <!-- Insight 2 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0" />
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)" />
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">AIでも埋まらない「速さ」の価値</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">比較検討した上でのレスポンスの速さは</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">経験からしか生まれない。速さ自体が価値</text>
      <rect x="16" y="72" width="48" height="12" rx="6" fill="#FF6D00" />
      <text x="40" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">洞察</text>
    </g>

    <!-- Insight 3 -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0" />
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)" />
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">タスク優先順位は3軸で判断する</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">期日・ユーザ影響度・進捗度の3つの軸を</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">状況に応じて使い分けることが重要</text>
      <rect x="16" y="72" width="64" height="12" rx="6" fill="#FF6D00" />
      <text x="48" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">スキル</text>
    </g>

    <!-- Insight 4 -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0" />
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)" />
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">リファインメントの良し悪しを言語化</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">感覚的に分かっていても言語化できない</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">状態。まず評価基準を明確にする必要がある</text>
      <rect x="16" y="72" width="48" height="12" rx="6" fill="#FF6D00" />
      <text x="40" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">課題</text>
    </g>
  </g>

  <!-- ==================== ROW 2: CHALLENGES + NEXT STEPS (y=632, h=220) ==================== -->

  <!-- CHALLENGES card (left) -->
  <rect x="24" y="632" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)" />
  <rect x="24" y="632" width="564" height="4" rx="2" fill="url(#dangerGrad)" />
  <text x="48" y="668" font-size="11" font-weight="800" fill="#FF1744" letter-spacing="1.5">CHALLENGES</text>
  <text x="48" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">課題・ブロッカー</text>

  <g transform="translate(48, 708)">
    <!-- Challenge 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="520" height="44" rx="10" fill="#FFEBEE" />
      <rect x="0" y="0" width="4" height="44" rx="2" fill="#FF1744" />
      <text x="16" y="27" font-size="14" font-weight="600" fill="#B71C1C">伝達力の不足（整理はできても伝わらない）</text>
      <rect x="420" y="12" width="80" height="22" rx="11" fill="#536DFE" />
      <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">対応中</text>
    </g>

    <!-- Challenge 2 -->
    <g transform="translate(0, 54)">
      <rect x="0" y="0" width="520" height="44" rx="10" fill="#FFEBEE" />
      <rect x="0" y="0" width="4" height="44" rx="2" fill="#FF1744" />
      <text x="16" y="27" font-size="14" font-weight="600" fill="#B71C1C">経験の差で勝負する限界と発想転換</text>
      <rect x="420" y="12" width="80" height="22" rx="11" fill="#FF6D00" />
      <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">調査中</text>
    </g>
  </g>

  <!-- NEXT STEPS card (right) -->
  <rect x="612" y="632" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)" />
  <rect x="612" y="632" width="564" height="4" rx="2" fill="url(#greenGrad)" />
  <text x="636" y="668" font-size="11" font-weight="800" fill="#00C853" letter-spacing="1.5">NEXT STEPS</text>
  <text x="636" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">次の一手</text>

  <g transform="translate(636, 708)">
    <!-- Next Step 1 (P1) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE" />
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744" />
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">ANS取得（AWS Networking）</text>
    </g>

    <!-- Next Step 2 (P1) -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE" />
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744" />
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">AIP取得（AWS AI Practitioner）</text>
    </g>

    <!-- Next Step 3 (P2) -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0" />
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00" />
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">ソフトスキル（伝達力・先読み力）強化</text>
    </g>
  </g>

  <!-- ==================== KEY THEME BANNER (y=876, h=120) ==================== -->
  <rect x="24" y="876" width="1152" height="120" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)" />
  <circle cx="1100" cy="912" r="60" fill="#7C4DFF" opacity="0.12" />
  <circle cx="1060" cy="952" r="40" fill="#536DFE" opacity="0.08" />
  <text x="56" y="910" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="940" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">経験で勝負しない — 「作り手」として価値を創る</text>
  <text x="56" y="968" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">4/1「アイデア勝負」-> 4/2「ナレッジ配布」-> 4/3「作り手側で差別化」。3日間の議論が一つの方向性に収束</text>

  <!-- ==================== GROWTH PATH (y=1020, h=192) ==================== -->
  <rect x="24" y="1020" width="1152" height="192" rx="20" fill="#FFFFFF" filter="url(#elevation2)" />
  <text x="56" y="1056" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">GROWTH PATH</text>
  <text x="56" y="1078" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">AWS Cert + 作り手としての差別化ロードマップ</text>

  <!-- Progress bar -->
  <g transform="translate(56, 1096)">
    <rect x="0" y="16" width="1100" height="10" rx="5" fill="#E8EAF6" />
    <rect x="0" y="16" width="500" height="10" rx="5" fill="url(#progressGrad)" />

    <!-- MLS achieved marker -->
    <circle cx="220" cy="21" r="16" fill="url(#accentGrad)" />
    <text x="220" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">MLS</text>
    <text x="220" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#78909C">3/31</text>

    <!-- Daily log achieved marker -->
    <circle cx="500" cy="21" r="16" fill="url(#accentGrad)" />
    <text x="500" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">LOG</text>
    <text x="500" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#78909C">日報継続</text>

    <!-- ANS target -->
    <circle cx="700" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3" />
    <text x="700" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#00C853">ANS</text>
    <text x="700" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#78909C">目標</text>

    <!-- AIP target -->
    <circle cx="880" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3" />
    <text x="880" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="#00C853">AIP</text>
    <text x="880" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#78909C">6月</text>

    <!-- Maker goal -->
    <circle cx="1060" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3" />
    <text x="1060" y="24" text-anchor="middle" font-size="7" font-weight="700" fill="#00C853">MAKER</text>
    <text x="1060" y="50" text-anchor="middle" font-size="10" font-weight="600" fill="#78909C">作り手</text>
  </g>

  <!-- Lever tags -->
  <g transform="translate(56, 1188)">
    <text x="0" y="14" font-size="12" font-weight="600" fill="#78909C">成長レバー:</text>
    <rect x="96" y="0" width="80" height="26" rx="13" fill="url(#accentGrad)" />
    <text x="136" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">資格取得</text>
    <rect x="184" y="0" width="96" height="26" rx="13" fill="url(#sunGrad)" />
    <text x="232" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ソフトスキル</text>
    <rect x="288" y="0" width="80" height="26" rx="13" fill="url(#greenGrad)" />
    <text x="328" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">提案力</text>
    <rect x="376" y="0" width="96" height="26" rx="13" fill="url(#warmGrad)" />
    <text x="424" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">独自の感性</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <text x="600" y="1252" text-anchor="middle" font-size="11" font-weight="400" fill="#B0BEC5" letter-spacing="0.5">LifeAI Daily Insights — 2026-04-03</text>
</svg>
