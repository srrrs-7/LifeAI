    <text x="220" y="25" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">4/1</text>
    <circle cx="440" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="440" y="25" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">4/3</text>
    <circle cx="660" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="660" y="25" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">4/6</text>
    <circle cx="880" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="880" y="25" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">4/7</text>
