  <!-- growth_y = 916 -->
  <rect x="24" y="916" width="1152" height="192" rx="20" fill="#FFFFFF" filter="url(#elevation2)"/>
  <text x="56" y="952" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">GROWTH PATH</text>
  <text x="56" y="974" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">技術力 → 経営視点 → ロックイン戦略 → ビジネス構築</text>

  <g transform="translate(56, 992)">
    <rect x="0" y="16" width="1100" height="10" rx="5" fill="#E8EAF6"/>
    <rect x="0" y="16" width="825" height="10" rx="5" fill="url(#progressGrad)"/>
    <!-- 4/8 挑戦 -->
    <circle cx="275" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="275" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/8</text>
    <!-- 4/10 経営 -->
    <circle cx="550" cy="21" r="16" fill="url(#sunGrad)"/>
    <text x="550" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/10</text>
    <!-- 4/13 ロックイン -->
    <circle cx="825" cy="21" r="16" fill="url(#warmGrad)"/>
    <text x="825" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/13</text>
    <!-- NEXT -->
    <circle cx="1045" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="1045" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#00C853">NEXT</text>
