  <g transform="translate(56, 1084)">
    <text x="0" y="14" font-size="12" font-weight="600" fill="#78909C">LEVERS</text>
    <rect x="64" y="0" width="128" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="128" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">挑戦の時代</text>
    <rect x="200" y="0" width="152" height="26" rx="13" fill="url(#sunGrad)"/>
    <text x="276" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">経営リテラシー</text>
    <rect x="360" y="0" width="160" height="26" rx="13" fill="url(#warmGrad)"/>
    <text x="440" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ロックイン設計</text>
    <rect x="528" y="0" width="168" height="26" rx="13" fill="url(#greenGrad)"/>
    <text x="612" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ビジネス構築</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <text x="600" y="1148" text-anchor="middle" font-size="11" font-weight="400" fill="#B0BEC5" letter-spacing="0.5">LifeAI Daily Insights — 2026.04.13</text>
</svg>
