  <rect x="612" y="528" width="564" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="636" y="564" font-size="11" font-weight="800" fill="#00C853" letter-spacing="1.5">NEXT STEPS</text>
  <text x="636" y="586" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">次の一手</text>
  <text x="1152" y="586" text-anchor="end" font-size="12" font-weight="600" fill="#00C853">x3</text>

  <g transform="translate(636, 604)">
    <!-- P1 ビジネス構築 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">ビジネス構築スキルの戦略を練る</text>
    </g>
    <!-- P2 プロダクトアイデア -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">意思決定の影響をAIで可視化するアイデア深掘り</text>
    </g>
    <!-- P3 投資×AI -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#E8F5E9"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#00C853"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#00C853">P3</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">投資 × AI の可能性模索を継続する</text>
    </g>
  </g>

  <!-- ==================== KEY THEME BANNER ==================== -->
  <!-- keytheme_y = 772 -->
  <rect x="24" y="772" width="1152" height="120" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)"/>
  <circle cx="1100" cy="808" r="60" fill="#7C4DFF" opacity="0.12"/>
  <circle cx="1060" cy="848" r="40" fill="#536DFE" opacity="0.08"/>
  <text x="56" y="806" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="836" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">ロックイン設計 — 付加価値を戦略に変える</text>
  <text x="56" y="864" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">データ蓄積 × AI高速スケールで、気づいたら抜けられない構成を構築する</text>

