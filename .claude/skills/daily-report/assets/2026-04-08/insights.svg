<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>
    <linearGradient id="keyInsightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <filter id="elevation1" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.07)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.05)"/>
    </filter>
    <filter id="elevation2" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
    <clipPath id="heroClip">
      <rect width="1200" height="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1140" fill="#f5f5f7"/>

  <!-- ==================== HERO HEADER ==================== -->
  <g clip-path="url(#heroClip)">
    <rect width="1200" height="100" fill="url(#heroGrad)"/>
    <circle cx="1100" cy="20" r="120" fill="#536DFE" opacity="0.07"/>
    <circle cx="1140" cy="80" r="70" fill="#7C4DFF" opacity="0.05"/>
    <circle cx="50" cy="80" r="40" fill="#00E5FF" opacity="0.04"/>
  </g>

  <!-- Date chip -->
  <rect x="40" y="12" width="200" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="56" y="29" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">2026年04月08日（水）</text>

  <!-- Title + subtitle -->
  <text x="40" y="52" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Daily Insights</text>
  <text x="40" y="74" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">メール基盤完成 / モデル使い分け戦略 / 挑戦者の時代</text>

  <!-- Stats badges -->
  <g transform="translate(860, 68)">
    <rect width="84" height="22" rx="11" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="12" y="16" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
    <text x="28" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.85)">TASKS</text>
    <rect x="92" width="108" height="22" rx="11" fill="url(#sunGrad)" opacity="0.9"/>
    <text x="104" y="16" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
    <text x="120" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.9)">INSIGHTS</text>
  </g>

  <!-- ==================== ROW 1: ACTIVITIES + INSIGHTS (y=124, h=380) ==================== -->

  <!-- Activities Card -->
  <rect x="24" y="124" width="564" height="380" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="24" y="124" width="564" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="160" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">ACTIVITIES</text>
  <text x="48" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">実施事項</text>
  <text x="564" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#536DFE">x3</text>

  <g transform="translate(48, 200)">
    <!-- Activity 1 -->
    <rect x="0" y="0" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="12" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="26" font-size="14" font-weight="600" fill="#0a0a1a">メンテナンスページ実装</text>

    <!-- Activity 2 -->
    <rect x="0" y="48" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="60" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="74" font-size="14" font-weight="600" fill="#0a0a1a">メール基盤: DNS/SPF/DKIM/DMARC設定</text>

    <!-- Activity 3 -->
    <rect x="0" y="96" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="108" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="122" font-size="14" font-weight="600" fill="#0a0a1a">リファインメント参加</text>
  </g>

  <!-- Insights Card -->
  <rect x="612" y="124" width="564" height="380" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="612" y="124" width="564" height="4" rx="2" fill="url(#sunGrad)"/>
  <text x="636" y="160" font-size="11" font-weight="800" fill="#E65100" letter-spacing="1.5">INSIGHTS</text>
  <text x="636" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">気づき・学び</text>
  <text x="1152" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#E65100">x3</text>

  <g transform="translate(636, 200)">
    <!-- KEY INSIGHT (Von Restorff) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="url(#keyInsightBg)" filter="url(#elevation1)"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="url(#warmGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="800" fill="#BF360C">モデル使い分けが最適化の現実解</text>
      <text x="16" y="44" font-size="12" font-weight="500" fill="#4E342E">Opus=設計, Sonnet=実装, Haiku=簡易</text>
      <text x="16" y="62" font-size="12" font-weight="500" fill="#4E342E">ローカルLLMも選択肢に加えてコスト最適化</text>
      <rect x="16" y="72" width="80" height="12" rx="6" fill="url(#warmGrad)"/>
      <text x="56" y="82" text-anchor="middle" font-size="8" font-weight="800" fill="#FFFFFF">KEY INSIGHT</text>
    </g>

    <!-- Insight 2 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">実務DNS設定は最高の学習体験</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">SPF/DKIM/DMARCをゼロから構築</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">座学と実務の橋渡しで理解が深化</text>
      <rect x="16" y="72" width="56" height="12" rx="6" fill="#FF6D00"/>
      <text x="44" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">LEARNING</text>
    </g>

    <!-- Insight 3 -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">会議では不足ロールをassumeする</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">ポジショニングの意識が会議の質を左右</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">参加者に足りない視点を自ら補完する</text>
      <rect x="16" y="72" width="72" height="12" rx="6" fill="#FF6D00"/>
      <text x="52" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">SOFT SKILL</text>
    </g>
  </g>

  <!-- ==================== ROW 2: CHALLENGES + NEXT STEPS (y=528, h=220) ==================== -->

  <!-- Challenges Card -->
  <rect x="24" y="528" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="24" y="528" width="564" height="4" rx="2" fill="url(#dangerGrad)"/>
  <text x="48" y="564" font-size="11" font-weight="800" fill="#FF1744" letter-spacing="1.5">CHALLENGES</text>
  <text x="48" y="586" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">課題・ブロッカー</text>

  <g transform="translate(48, 604)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="520" height="44" rx="10" fill="#E8F5E9"/>
      <rect x="0" y="0" width="4" height="44" rx="2" fill="#00C853"/>
      <text x="16" y="27" font-size="14" font-weight="600" fill="#1B5E20">特になし — メール基盤が順調に完了</text>
      <rect x="420" y="12" width="80" height="22" rx="11" fill="#00C853"/>
      <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">完了</text>
    </g>
  </g>

  <!-- Next Steps Card -->
  <rect x="612" y="528" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="612" y="528" width="564" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="636" y="564" font-size="11" font-weight="800" fill="#00C853" letter-spacing="1.5">NEXT STEPS</text>
  <text x="636" y="586" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">次の一手</text>

  <g transform="translate(636, 604)">
    <!-- P1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">ネットワーク学習を継続</text>
    </g>

    <!-- P2 -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">モデル使い分け戦略を具体化</text>
    </g>

    <!-- P3 -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#E8F5E9"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#00C853"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#00C853">P3</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">AWS知識をAzureに転用</text>
    </g>
  </g>

  <!-- ==================== KEY THEME BANNER (y=772, h=120) ==================== -->
  <rect x="24" y="772" width="1152" height="120" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)"/>
  <circle cx="1100" cy="808" r="60" fill="#7C4DFF" opacity="0.12"/>
  <circle cx="1060" cy="848" r="40" fill="#536DFE" opacity="0.08"/>
  <text x="56" y="806" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="836" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">挑戦した者勝ちの時代</text>
  <text x="56" y="864" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">Claudeがいれば未知の領域でも前進できる — 知らないことは障壁ではなくなった</text>

  <!-- ==================== WORKFLOW SECTION (y=916, h=160) ==================== -->
  <rect x="24" y="916" width="1152" height="160" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)"/>
  <circle cx="1100" cy="952" r="50" fill="#7C4DFF" opacity="0.10"/>
  <text x="56" y="950" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">WORKFLOW OF THE DAY</text>
  <text x="56" y="980" font-size="20" font-weight="800" fill="#FFFFFF">メール基盤: 設計 → 実装 → 完了の3日間</text>

  <!-- Flow steps -->
  <g transform="translate(56, 996)">
    <rect x="0" y="0" width="136" height="32" rx="8" fill="url(#accentGrad)"/>
    <text x="68" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4/6 設計</text>
    <text x="152" y="21" font-size="16" fill="rgba(255,255,255,0.4)">→</text>

    <rect x="176" y="0" width="136" height="32" rx="8" fill="url(#sunGrad)"/>
    <text x="244" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4/7 ブラッシュアップ</text>
    <text x="328" y="21" font-size="16" fill="rgba(255,255,255,0.4)">→</text>

    <rect x="352" y="0" width="136" height="32" rx="8" fill="url(#greenGrad)"/>
    <text x="420" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4/8 実装完了</text>
    <text x="504" y="21" font-size="16" fill="rgba(255,255,255,0.4)">→</text>

    <rect x="528" y="0" width="136" height="32" rx="8" fill="url(#tealGrad)"/>
    <text x="596" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">通知送信成功</text>
  </g>

  <text x="56" y="1056" font-size="12" fill="rgba(255,255,255,0.5)">Claude協働による3日間スプリント — 設計から本番稼働まで一気通貫</text>

  <!-- ==================== FOOTER ==================== -->
  <text x="600" y="1116" text-anchor="middle" font-size="11" font-weight="400" fill="#B0BEC5" letter-spacing="0.5">LifeAI Daily Insights — 2026-04-08</text>

</svg>
