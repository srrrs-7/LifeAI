      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">議論につまったら抽象化する</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">一段上の抽象に戻り前提を問い直す</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">書籍『抽象と具体』が思考の支えに</text>
      <rect x="16" y="72" width="56" height="12" rx="6" fill="#FF6D00"/>
      <text x="44" y="82" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">MINDSET</text>
    </g>
  </g>

