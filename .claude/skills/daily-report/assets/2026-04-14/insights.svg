      <rect x="0" y="0" width="4" height="44" rx="2" fill="#FF1744"/>
      <text x="16" y="27" font-size="14" font-weight="600" fill="#B71C1C">一人でリファインメント完走の体制づくり</text>
      <rect x="420" y="12" width="80" height="22" rx="11" fill="#536DFE"/>
      <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">対応中</text>
    </g>
    <g transform="translate(0, 54)">
      <rect x="0" y="0" width="520" height="44" rx="10" fill="#FFEBEE"/>
      <rect x="0" y="0" width="4" height="44" rx="2" fill="#FF1744"/>
      <text x="16" y="27" font-size="14" font-weight="600" fill="#B71C1C">前回の次の一手 3 件が未着手のまま</text>
      <rect x="420" y="12" width="80" height="22" rx="11" fill="#FF1744"/>
      <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">未着手</text>
    </g>
  </g>

  <!-- ROW 2: Next Steps (right) -->
  <rect x="612" y="632" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="612" y="632" width="564" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="636" y="668" font-size="11" font-weight="800" fill="#00C853" letter-spacing="1.5">NEXT STEPS</text>
  <text x="636" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">次の一手</text>
  <text x="1152" y="690" text-anchor="end" font-size="12" font-weight="600" fill="#00C853">x3</text>
  <g transform="translate(636, 708)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFEBEE"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF1744"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF1744">P1</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">リファインメントの質を上げ一人で完走</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">PBI テンプレートに 5W 項目を正式追加</text>
    </g>
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#E8F5E9"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#00C853"/>
      <text x="26" y="14" font-size="11" font-weight="800" fill="#00C853">P3</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">ビジネス構築スキルの戦略に 30 分着手</text>
    </g>
  </g>

  <!-- KEY THEME Banner -->
  <rect x="24" y="876" width="1152" height="120" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)"/>
  <circle cx="1100" cy="912" r="60" fill="#7C4DFF" opacity="0.12"/>
  <circle cx="1060" cy="952" r="40" fill="#536DFE" opacity="0.08"/>
  <text x="56" y="910" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="940" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">目的ドリブンな議論設計 — why で上流、how で前進</text>
  <text x="56" y="968" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">課題ベースで始め、解決策を検証し、how は実装と並走して解像度を上げる</text>

  <!-- Growth Path Section -->
  <rect x="24" y="1020" width="1152" height="192" rx="20" fill="#FFFFFF" filter="url(#elevation2)"/>
  <text x="56" y="1056" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">GROWTH PATH</text>
  <text x="56" y="1078" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">リファインメント独力完走までの道のり</text>

  <g transform="translate(56, 1096)">
    <rect x="0" y="16" width="1100" height="10" rx="5" fill="#E8EAF6"/>
    <rect x="0" y="16" width="620" height="10" rx="5" fill="url(#progressGrad)"/>
    <!-- Achieved marker -->
    <circle cx="220" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="220" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">WHY</text>
    <!-- Current -->
    <circle cx="620" cy="21" r="16" fill="url(#sunGrad)"/>
    <text x="620" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">WHAT</text>
    <!-- Target marker -->
    <circle cx="980" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="980" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#00C853">HOW</text>
  </g>

  <g transform="translate(56, 1188)">
    <text x="0" y="14" font-size="12" font-weight="600" fill="#78909C">LEVERS:</text>
    <rect x="72" y="0" width="120" height="22" rx="11" fill="url(#accentGrad)"/>
    <text x="132" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">目的の言語化</text>
    <rect x="204" y="0" width="140" height="22" rx="11" fill="url(#sunGrad)"/>
    <text x="274" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">解決策の妥当性検証</text>
    <rect x="356" y="0" width="140" height="22" rx="11" fill="url(#greenGrad)"/>
    <text x="426" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">実装と並走する how</text>
    <rect x="508" y="0" width="120" height="22" rx="11" fill="url(#tealGrad)"/>
    <text x="568" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">抽象⇄具体の往復</text>
  </g>

  <!-- Footer -->
  <text x="600" y="1252" text-anchor="middle" font-size="11" font-weight="400" fill="#B0BEC5" letter-spacing="0.5">LifeAI Daily Insights — 2026.04.14</text>
</svg>
