      <text x="16" y="62" font-size="12" fill="#5D4037">3 者を行き来して認識を揃えるのが本質</text>
      <rect x="16" y="72" width="64" height="12" rx="6" fill="#FF6D00"/>
      <text x="48" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">FRAMEWORK</text>
    </g>

    <g transform="translate(0, 200)">
