      <rect x="0" y="0" width="6" height="88" rx="3" fill="url(#warmGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="800" fill="#BF360C">議論は目的の明確化から始める</text>
      <text x="16" y="44" font-size="12" font-weight="500" fill="#4E342E">why が定まって初めて解決策の妥当性を</text>
      <text x="16" y="62" font-size="12" font-weight="500" fill="#4E342E">検証でき、その先で how を深掘りできる</text>
      <rect x="16" y="72" width="80" height="12" rx="6" fill="url(#warmGrad)"/>
      <text x="56" y="82" text-anchor="middle" font-size="8" font-weight="800" fill="#FFFFFF">KEY INSIGHT</text>
    </g>

    <g transform="translate(0, 100)">
