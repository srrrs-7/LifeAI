  <rect x="24" y="632" width="564" height="4" rx="2" fill="url(#dangerGrad)"/>
  <text x="48" y="668" font-size="11" font-weight="800" fill="#FF1744" letter-spacing="1.5">CHALLENGES</text>
  <text x="48" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">課題・ブロッカー</text>
  <text x="564" y="690" text-anchor="end" font-size="12" font-weight="600" fill="#FF1744">x2</text>
