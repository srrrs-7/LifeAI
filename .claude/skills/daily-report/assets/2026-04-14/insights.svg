  <!-- Background -->
  <rect width="1200" height="1276" fill="#f5f5f7"/>

  <!-- Hero Header -->
  <g clip-path="url(#heroClip)">
    <rect width="1200" height="100" fill="url(#heroGrad)"/>
    <circle cx="1100" cy="20" r="120" fill="#536DFE" opacity="0.07"/>
    <circle cx="1140" cy="80" r="70" fill="#7C4DFF" opacity="0.05"/>
    <circle cx="50" cy="80" r="40" fill="#00E5FF" opacity="0.04"/>
  </g>
  <rect x="40" y="12" width="200" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="56" y="29" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">2026.04.14 TUE / DAILY</text>
  <text x="40" y="58" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">why-what-how を往復する議論設計の日</text>
  <text x="40" y="80" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">MFA 組み込み設計・メール基盤微修正・Skill 作成</text>
  <g transform="translate(860, 68)">
    <rect width="84" height="22" rx="11" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="12" y="16" font-size="13" font-weight="800" fill="#FFFFFF">5</text>
    <text x="28" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.85)">TASKS</text>
    <rect x="92" width="108" height="22" rx="11" fill="url(#sunGrad)" opacity="0.9"/>
    <text x="104" y="16" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
    <text x="120" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.9)">INSIGHTS</text>
  </g>

  <!-- ROW 1: Activities (left) -->
  <rect x="24" y="124" width="564" height="484" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="24" y="124" width="564" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="160" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">ACTIVITIES</text>
  <text x="48" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">実施事項</text>
  <text x="564" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#536DFE">x5</text>
  <g transform="translate(48, 200)">
    <rect x="0" y="0" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="12" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="26" font-size="14" font-weight="600" fill="#0a0a1a">Azure Entra ID で MFA を設定・組み込み設計</text>

    <rect x="0" y="48" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="60" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="74" font-size="14" font-weight="600" fill="#0a0a1a">メール基盤の微修正（継続改善サイクル）</text>

    <rect x="0" y="96" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="108" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="122" font-size="14" font-weight="600" fill="#0a0a1a">新しい Skill を作成・対話資産を追加</text>

    <rect x="0" y="144" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="156" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="170" font-size="14" font-weight="600" fill="#0a0a1a">リファインメントの型を why-what-how で整理</text>

    <rect x="0" y="192" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="204" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="218" font-size="14" font-weight="600" fill="#0a0a1a">PBI に why/what/how/when/who 項目を明示化</text>
  </g>

