      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">how は実装と並行して解像度が上がる</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">事前にすべて詰めず、作りながら精度を</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">高めるバランスがコストを抑える</text>
      <rect x="16" y="72" width="56" height="12" rx="6" fill="#FF6D00"/>
      <text x="44" y="82" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">BALANCE</text>
    </g>

    <g transform="translate(0, 300)">
