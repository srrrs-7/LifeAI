<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1276" viewBox="0 0 1200 1276" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536DFE"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>
    <linearGradient id="keyInsightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <filter id="elevation1" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.07)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.05)"/>
    </filter>
    <filter id="elevation2" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
    <clipPath id="heroClip">
      <rect width="1200" height="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1276" fill="#f5f5f7"/>

  <!-- ==================== HERO HEADER ==================== -->
  <rect width="1200" height="100" fill="url(#heroGrad)" clip-path="url(#heroClip)"/>
  <circle cx="1100" cy="20" r="120" fill="#536DFE" opacity="0.07"/>
  <circle cx="1140" cy="80" r="70" fill="#7C4DFF" opacity="0.05"/>
  <circle cx="50" cy="80" r="40" fill="#00E5FF" opacity="0.04"/>

  <rect x="40" y="12" width="220" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
  <text x="56" y="29" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">2026.04.10 FRIDAY</text>

  <text x="40" y="56" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">AI時代の働き方と経営リテラシー</text>
  <text x="40" y="78" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">PR微修正・スプリントレビューと、視座のズームアウト</text>

  <g transform="translate(860, 68)">
    <rect width="84" height="22" rx="11" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="12" y="16" font-size="13" font-weight="800" fill="#FFFFFF">5</text>
    <text x="28" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.85)">TASKS</text>
    <rect x="92" width="108" height="22" rx="11" fill="url(#sunGrad)" opacity="0.9"/>
    <text x="104" y="16" font-size="13" font-weight="800" fill="#FFFFFF">4</text>
    <text x="120" y="15" font-size="10" font-weight="500" fill="rgba(255,255,255,0.9)">INSIGHTS</text>
  </g>

  <!-- ==================== ROW 1: ACTIVITIES / INSIGHTS ==================== -->
  <!-- Activities Card (left) -->
  <rect x="24" y="124" width="564" height="484" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="24" y="124" width="564" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="160" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">ACTIVITIES</text>
  <text x="48" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">実施事項</text>
  <text x="550" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#536DFE">x5</text>

  <g transform="translate(48, 200)">
    <rect x="0" y="0" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="12" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="26" font-size="14" font-weight="600" fill="#0a0a1a">PR微修正（レビュー指摘の反映）</text>

    <rect x="0" y="48" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="60" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="74" font-size="14" font-weight="600" fill="#0a0a1a">スプリントレビューの実施</text>

    <rect x="0" y="96" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="108" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="122" font-size="14" font-weight="600" fill="#0a0a1a">セキュリティ対応の棚卸し・規模把握</text>

    <rect x="0" y="144" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="156" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="170" font-size="14" font-weight="600" fill="#0a0a1a">AWS Security Hub / GuardDutyの調査</text>

    <rect x="0" y="192" width="520" height="40" rx="10" fill="#EDE7F6"/>
    <rect x="12" y="204" width="16" height="16" rx="4" fill="url(#accentGrad)"/>
    <text x="38" y="218" font-size="14" font-weight="600" fill="#0a0a1a">資格取得ロードマップの再構築</text>
  </g>

  <!-- Insights Card (right) -->
  <rect x="612" y="124" width="564" height="484" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="612" y="124" width="564" height="4" rx="2" fill="url(#sunGrad)"/>
  <text x="636" y="160" font-size="11" font-weight="800" fill="#FF6D00" letter-spacing="1.5">INSIGHTS</text>
  <text x="636" y="182" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">気づき・学び</text>
  <text x="1152" y="182" text-anchor="end" font-size="12" font-weight="600" fill="#FF6D00">x4</text>

  <g transform="translate(636, 200)">
    <!-- Insight 1 (KEY INSIGHT - Von Restorff) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="url(#keyInsightBg)" filter="url(#elevation1)"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="url(#warmGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="800" fill="#BF360C">人類皆経営者の世界観が近づいている</text>
      <text x="16" y="44" font-size="12" font-weight="500" fill="#4E342E">AIを雇用し小商圏で小さく商う個人が増えそう</text>
      <text x="16" y="62" font-size="12" font-weight="500" fill="#4E342E">経営視点なしでは生き残りにくい世の中へ</text>
      <rect x="16" y="72" width="80" height="12" rx="6" fill="url(#warmGrad)"/>
      <text x="56" y="82" text-anchor="middle" font-size="8" font-weight="800" fill="#FFFFFF">KEY INSIGHT</text>
    </g>

    <!-- Insight 2 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">AIによる働き方の転換は時間の問題</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">雇用形態や労働時間の概念が根本から変わる</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">「いつか」ではなく「すでに」起きている前提で動く</text>
      <rect x="16" y="72" width="56" height="12" rx="6" fill="#FF6D00"/>
      <text x="44" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">TREND</text>
    </g>

    <!-- Insight 3 -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">AI商売に必須なのは経営リテラシー</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">ブランディング・マーケ・広告・財務・経営</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">技術だけでは価値提供の設計ができない</text>
      <rect x="16" y="72" width="72" height="12" rx="6" fill="#FF6D00"/>
      <text x="52" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">MINDSET</text>
    </g>

    <!-- Insight 4 -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="516" height="88" rx="12" fill="#FFF3E0"/>
      <rect x="0" y="0" width="4" height="88" rx="2" fill="url(#sunGrad)"/>
      <text x="16" y="24" font-size="14" font-weight="700" fill="#E65100">資本主義そのものが変わる可能性</text>
      <text x="16" y="44" font-size="12" fill="#5D4037">AIの生産性向上が従来の経済構造を揺さぶる</text>
      <text x="16" y="62" font-size="12" fill="#5D4037">AI社会主義的な新システムも視野に入れる</text>
      <rect x="16" y="72" width="64" height="12" rx="6" fill="#FF6D00"/>
      <text x="48" y="82" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">FUTURE</text>
    </g>
  </g>

  <!-- ==================== ROW 2: CHALLENGES / NEXT STEPS ==================== -->
  <!-- Challenges Card (left) -->
  <rect x="24" y="632" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="24" y="632" width="564" height="4" rx="2" fill="url(#dangerGrad)"/>
  <text x="48" y="668" font-size="11" font-weight="800" fill="#FF1744" letter-spacing="1.5">CHALLENGES</text>
  <text x="48" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">課題・ブロッカー</text>
  <text x="550" y="690" text-anchor="end" font-size="12" font-weight="600" fill="#FF1744">x0</text>

  <g transform="translate(48, 708)">
    <rect x="0" y="0" width="520" height="44" rx="10" fill="#E8F5E9"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#00C853"/>
    <text x="16" y="27" font-size="14" font-weight="600" fill="#1B5E20">本日時点で具体的なブロッカーはなし</text>
    <rect x="420" y="12" width="80" height="22" rx="11" fill="#00C853"/>
    <text x="460" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">CLEAR</text>
  </g>

  <!-- Next Steps Card (right) -->
  <rect x="612" y="632" width="564" height="220" rx="16" fill="#FFFFFF" filter="url(#elevation1)"/>
  <rect x="612" y="632" width="564" height="4" rx="2" fill="url(#greenGrad)"/>
  <text x="636" y="668" font-size="11" font-weight="800" fill="#00C853" letter-spacing="1.5">NEXT STEPS</text>
  <text x="636" y="690" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">次の一手</text>
  <text x="1152" y="690" text-anchor="end" font-size="12" font-weight="600" fill="#00C853">x3</text>

  <g transform="translate(636, 708)">
    <!-- P2 Investment x AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">投資 × AI の可能性を模索する</text>
    </g>
    <!-- P2 AWS Security -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#FFF3E0"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#FF6D00"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#FF6D00">P2</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">Security Hub / GuardDuty を触ってみる</text>
    </g>
    <!-- P3 資格整理 -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="516" height="36" rx="8" fill="#E8F5E9"/>
      <rect x="8" y="8" width="10" height="20" rx="5" fill="#00C853"/>
      <text x="26" y="22" font-size="11" font-weight="800" fill="#00C853">P3</text>
      <text x="52" y="24" font-size="14" font-weight="600" fill="#0a0a1a">取得したい資格の全体像と優先順位を整理</text>
    </g>
  </g>

  <!-- ==================== KEY THEME BANNER ==================== -->
  <rect x="24" y="876" width="1152" height="120" rx="20" fill="url(#peakGrad)" filter="url(#elevation2)"/>
  <circle cx="1100" cy="912" r="60" fill="#7C4DFF" opacity="0.12"/>
  <circle cx="1060" cy="952" r="40" fill="#536DFE" opacity="0.08"/>
  <text x="56" y="910" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="940" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">技術から経営・社会レイヤーへ視座を広げる</text>
  <text x="56" y="968" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">AI時代を生き抜く経営リテラシーと、投資×AIという新しい探究テーマ</text>

  <!-- ==================== GROWTH PATH SECTION ==================== -->
  <rect x="24" y="1020" width="1152" height="192" rx="20" fill="#FFFFFF" filter="url(#elevation2)"/>
  <text x="56" y="1056" font-size="11" font-weight="800" fill="#536DFE" letter-spacing="1.5">GROWTH PATH</text>
  <text x="56" y="1078" font-size="18" font-weight="800" fill="#0a0a1a" letter-spacing="-0.3">技術レイヤー → 経営・社会レイヤーへのズームアウト</text>

  <g transform="translate(56, 1096)">
    <rect x="0" y="16" width="1100" height="10" rx="5" fill="#E8EAF6"/>
    <rect x="0" y="16" width="770" height="10" rx="5" fill="url(#progressGrad)"/>
    <circle cx="220" cy="21" r="16" fill="url(#accentGrad)"/>
    <text x="220" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/8</text>
    <circle cx="495" cy="21" r="16" fill="url(#sunGrad)"/>
    <text x="495" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/9</text>
    <circle cx="770" cy="21" r="16" fill="url(#warmGrad)"/>
    <text x="770" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">4/10</text>
    <circle cx="1045" cy="21" r="16" fill="#FFFFFF" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="1045" y="25" text-anchor="middle" font-size="10" font-weight="800" fill="#00C853">NEXT</text>
  </g>

  <g transform="translate(56, 1188)">
    <text x="0" y="14" font-size="12" font-weight="600" fill="#78909C">LEVERS</text>
    <rect x="64" y="0" width="120" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="124" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">挑戦の時代</text>
    <rect x="196" y="0" width="152" height="26" rx="13" fill="url(#sunGrad)"/>
    <text x="272" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">経験と認可設計</text>
    <rect x="360" y="0" width="176" height="26" rx="13" fill="url(#warmGrad)"/>
    <text x="448" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">経営リテラシー</text>
    <rect x="548" y="0" width="152" height="26" rx="13" fill="url(#greenGrad)"/>
    <text x="624" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">投資 × AI</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <text x="600" y="1252" text-anchor="middle" font-size="11" font-weight="400" fill="#B0BEC5" letter-spacing="0.5">LifeAI Daily Insights — 2026.04.10</text>
</svg>
