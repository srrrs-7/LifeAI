    <rect x="184" y="0" width="80" height="26" rx="13" fill="url(#sunGrad)" />
    <text x="224" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">AI活用</text>
    <rect x="272" y="0" width="96" height="26" rx="13" fill="url(#greenGrad)" />
    <text x="320" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">データ戦略</text>
