  <circle cx="1100" cy="808" r="60" fill="#7C4DFF" opacity="0.12" />
  <circle cx="1060" cy="848" r="40" fill="#536DFE" opacity="0.08" />
  <text x="56" y="806" font-size="11" font-weight="800" fill="rgba(255,255,255,0.5)" letter-spacing="2.5">TODAY'S KEY THEME</text>
  <text x="56" y="836" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">データ先行収集 x AI時代の戦略転換</text>
  <text x="56" y="864" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">「必要になったら集める」から「思いつく前に集めておく」へ。ポジショニングが勝負を分ける</text>

