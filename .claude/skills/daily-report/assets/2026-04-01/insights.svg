  <text x="40" y="52" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Q1振り返り / バッチ実装 / E2Eテスト</text>
  <text x="40" y="74" font-size="13" font-weight="400" fill="rgba(255,255,255,0.6)">外部連携バッチ・E2Eテスト・1-3月振り返りの充実した一日</text>

  <!-- Stats badges -->
