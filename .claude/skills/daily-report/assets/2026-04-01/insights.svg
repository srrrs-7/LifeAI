<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1172" viewBox="0 0 1200 1172" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
